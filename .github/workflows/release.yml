name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Compute version from commit count
        run: echo "VERSION=v$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Package whole repository
        run: |
          name="vhdx-manager-${VERSION}"
          git archive --format=zip --prefix="${name}/" -o "${name}.zip" HEAD -- . ':(exclude).github'

      - name: Remove legacy versioned releases
        run: |
          gh release list --limit 200 --json tagName --jq '.[].tagName' \
            | grep -E '^v[0-9]+$' \
            | xargs -r -n1 gh release delete --yes --cleanup-tag || true

      - name: Replace latest release
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --target "$(git rev-parse HEAD)" \
            --title "Latest (${VERSION})" \
            --notes "Whole repository at ${VERSION} ($(git rev-parse --short HEAD))." \
            "vhdx-manager-${VERSION}.zip"
